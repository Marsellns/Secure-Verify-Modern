version: '3.8'

services:
  app:
    build: .
    container_name: secure-product-verify-app
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=secure_product_verification
      - DB_PORT=3306
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spv-network

  db:
    image: mysql:8.0
    container_name: secure-product-verify-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=secure_product_verification
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spv-network

networks:
  spv-network:
    driver: bridge

volumes:
  mysql_data:
